<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name">
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
        <br><br>
<label for="dob">Date:</label>
<input type="date" id="dob" name="dob">
<br><br>

<label for="phone">Phone:</label>
<input type="tel" id="phone" name="phone">
<br><br>

<label>Gender:</label>
<input type="radio" id="male" name="gender" value="Male">
<label for="male">Male</label>

<input type="radio" id="female" name="gender" value="Female">
<label for="female">Female</label>
<br><br>

<label>Interests:</label>
<input type="checkbox" id="coding" name="interest" value="Coding">
<label for="coding">Coding</label>

<input type="checkbox" id="webdesign" name="interest" value="Web Design">
<label for="webdesign">Web Design</label>
<br><br>

<label for="course">Course:</label>
<select id="course" name="course">
    <option value="B.Tech">B.Tech</option>
    <option value="BCA">BCA</option>
    <option value="B.Sc">B.Sc</option>
</select>
<br><br>

<label for="message">Message:</label>
<textarea id="message" name="message"></textarea>
<br><br>

<input type="submit" value="Submit">

    </form>
    <h2>Events Table</h2>

<table border="1">
    <thead>
        <tr>
            <th>Event Name</th>
            <th>Date</th>
            <th>Venue</th>
        </tr>
    </thead>

    <tbody>
        <tr>
            <td>Web Development Workshop</td>
            <td>15 November 2026</td>
            <td>Computer Lab</td>
        </tr>
        <tr>
            <td>Coding Competition</td>
            <td>20 November 2026</td>
            <td>Seminar Hall</td>
        </tr>
    </tbody>

    <tfoot>
        <tr>
            <td colspan="3">Total Events: 2</td>
        </tr>
    </tfoot>
</table>

</body>
</html>
