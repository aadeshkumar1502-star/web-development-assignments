<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Discover modern solutions for your next project.">
    <title>NovaSpace | Creative Solutions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Task 9.1: Navbar using Flexbox -->
    <header class="header">
        <nav class="navbar container">
            <a href="#" class="logo">Nova<span>Space.</span></a>

            <div class="nav-links">
                <a href="#home">Home</a>
                <a href="#features">Features</a>
                <a href="#projects">Projects</a>
                <a href="#contact" class="nav-button">Get Started</a>
            </div>
        </nav>
    </header>
     <main>
        <!-- Task 9.2: Hero section -->
        <section class="hero container" id="home">
            <div class="hero-content">
                <p class="eyebrow">DESIGN YOUR FUTURE</p>
                <h1>Build something <span>amazing.</span></h1>
                <p class="hero-description">
                    Turn your ideas into reality with modern design,
                    creative thinking, and powerful digital solutions.
                </p>
                <div class="hero-actions">
                    <a href="#projects" class="button primary-button">
                        Explore Projects
                    </a>
                    <a href="#features" class="button secondary-button">
                        Learn More
                    </a>
                </div>
            </div>

            <div class="hero-image">
                <img
                    src="https://images.unsplash.com/photo-1497366754035-f200968a6e72?auto=format&fit=crop&w=1200&q=80"
                    alt="Modern creative workspace">
            </div>
        </section>
    </body>
</html>
