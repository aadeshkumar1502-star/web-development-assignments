<!DOCTYPE html>
<html>
<head>
    <title>Club Page</title>

    <style>
    /* Universal selector */
    * {
        box-sizing: border-box;
    }

    /* Element selector */
    h1 {
        color: navy;
    }

    /* Class selector */
    .card {
        background-color: lightgray;
        padding: 20px;
    }

    /* ID selector */
    #hero {
        text-align: center;
    }

body {
    font-family: Arial, sans-serif;
    font-size: 16px;
    line-height: 1.6;
    color: #333333;
}

p {
    font-size: 16px;
    line-height: 1.6;
}
</style>

</head>
<body>

    <div id="hero">
    <h1>Welcome to Our Club</h1>
    <p>This is our club page.</p>
</div>

<div class="card">
    <h2>About Our Club</h2>
    <p>Welcome to our club website.</p>
</div>   

</body>
</html>
