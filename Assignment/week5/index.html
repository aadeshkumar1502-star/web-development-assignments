<!DOCTYPE html>
<html>
<head>
    <title>Club Page</title>

    <style>

:root {
    --main-color: navy;
    --card-background: lightgray;
    --main-font: Arial, sans-serif;
    --spacing: 20px;


}
    * {
        box-sizing: border-box;
    }

    h1 {
        color: var(--main-color);
    }

    .card {
        background-color: var(--card-background);
    padding: var(--spacing);
    }

    #hero {
        text-align: center;
    }

body {

    font-family: var(--main-font);
    font-size: 16px;
    line-height: 1.6;
    color: #333333;
}    

p {
    font-size: 16px;
    line-height: 1.6;
}
</style>

</head>
<body>

    <div id="hero">
    <h1>Welcome to Our Club</h1>
    <p>This is our club page.</p>
</div>

<div class="card">
    <h2>About Our Club</h2>
    <p>Welcome to our club website.</p>
</div>   

<div class="card">
    <h2>Why I Chose These Colours</h2>
    <p>Blue gives the page a professional and trustworthy look.</p>
    <p>Light grey makes the page look clean and simple.</p>
    <p>Dark grey text is easy to read on a light background.</p>  
</div>
</body>
</html>
